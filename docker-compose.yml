services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rmm
      POSTGRES_PASSWORD: rmm
      POSTGRES_DB: rmm
    volumes:
      - rmm_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmm"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./control-plane
    environment:
      DATABASE_URL: postgresql://rmm:rmm@db:5432/rmm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  rmm_db_data:
